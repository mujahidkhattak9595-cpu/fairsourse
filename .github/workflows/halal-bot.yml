import os, random, requests

TOKEN = os.getenv("BOT_TOKEN")
CHANNEL = os.getenv("CHANNEL_ID")

PRODUCTS = [
    {"title": "Premium Muslim Prayer Cap Topi", "price": "$4.99", "link": "https://s.click.aliexpress.com/e/_DD5zKzJ"},
    {"title": "Digital Tasbeeh Counter Ring", "price": "$2.99", "link": "https://s.click.aliexpress.com/e/_DD5zKzJ"},
    {"title": "Attar Perfume Alcohol Free", "price": "$8.99", "link": "https://s.click.aliexpress.com/e/_DD5zKzJ"},
    {"title": "Islamic LED Night Light", "price": "$6.49", "link": "https://s.click.aliexpress.com/e/_DD5zKzJ"},
]

p = random.choice(PRODUCTS)
msg = f"🔥 **{p['title']}**\n\n💰 Price: {p['price']}\n⭐ Best Seller\n\n🛒 Order Now:\n{p['link']}\n\n#Deals #Offer #Trending"

url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
data = {"chat_id": CHANNEL, "text": msg, "parse_mode": "Markdown"}
r = requests.post(url, data=data)
print(f"Telegram Response: {r.text}")
